name: Generate Audio MP3
run-name: Audio job ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Random job UUID (not a story title)
        required: true
        type: string
      payload_branch:
        description: Temporary branch containing the plain JSON job input
        required: true
        type: string
      max_parallel:
        description: Maximum number of chapter jobs running at the same time (30 runs typical 15-20 chapter books together)
        required: false
        default: "30"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "6"
          - "8"
          - "10"
          - "20"
          - "30"

permissions:
  contents: write
  actions: read

concurrency:
  group: sanh-audio-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare segment list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      segment_matrix: ${{ steps.plan.outputs.segment_matrix }}
      segment_count: ${{ steps.plan.outputs.segment_count }}
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Fetch plain JSON job payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PAYLOAD_BRANCH: ${{ inputs.payload_branch }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python - <<'PY'
          import os, subprocess
          repo = os.environ["GH_REPOSITORY"]
          branch = os.environ["PAYLOAD_BRANCH"]
          job_id = os.environ["JOB_ID"]
          ref = f"refs/heads/{branch}"
          subprocess.run(["git", "fetch", "origin", f"{ref}:refs/remotes/origin/{branch}"], check=True)
          path = f"audio_jobs/{job_id}/payload.json"
          result = subprocess.run(["git", "show", f"refs/remotes/origin/{branch}:{path}"], check=True, stdout=subprocess.PIPE)
          os.makedirs("work/input", exist_ok=True)
          with open("work/input/payload.json", "wb") as f:
              f.write(result.stdout)
          PY

      - name: Build one matrix entry for every chapter
        id: plan
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python worker/run_job.py \
            --payload work/input/payload.json \
            --output work/plan \
            --prepare-matrix

      - name: Upload source payload for chapter jobs
        uses: actions/upload-artifact@v4
        with:
          name: audio-payload-${{ inputs.job_id }}
          path: work/input/payload.json
          if-no-files-found: error
          retention-days: 1

  synthesize:
    needs: prepare
    name: TTS ${{ matrix.segment_label }}/${{ needs.prepare.outputs.segment_count }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Change max_parallel above (or this default in workflow_dispatch) to tune concurrency.
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.segment_matrix) }}
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download source payload
        uses: actions/download-artifact@v4
        with:
          name: audio-payload-${{ inputs.job_id }}
          path: work/input

      - name: Synthesize exactly one chapter into one MP3
        env:
          JOB_ID: ${{ inputs.job_id }}
          SEGMENT_INDEX: ${{ matrix.segment_index }}
        run: |
          python worker/run_job.py \
            --payload work/input/payload.json \
            --output work/segment \
            --segment-index "$SEGMENT_INDEX"

      - name: Upload chapter MP3 result
        uses: actions/upload-artifact@v4
        with:
          name: tts-${{ matrix.segment_label }}-of-${{ needs.prepare.outputs.segment_count }}
          path: work/segment/tts ${{ matrix.segment_label }}-*.mp3
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge audiobook
    needs: [prepare, synthesize]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download source payload
        uses: actions/download-artifact@v4
        with:
          name: audio-payload-${{ inputs.job_id }}
          path: work/input

      - name: Download every chapter MP3
        uses: actions/download-artifact@v4
        with:
          pattern: tts-*
          path: work/segments
          merge-multiple: true

      - name: Merge all chapter MP3 files in original order into one audiobook
        env:
          JOB_ID: ${{ inputs.job_id }}
          AUDIO_INDEX: ${{ github.run_number }}
        run: |
          python worker/run_job.py \
            --payload work/input/payload.json \
            --output work/result \
            --merge-segments work/segments \
            --max-parallel "${{ inputs.max_parallel }}" \
            --output-name "au${AUDIO_INDEX}.mp3"

      - name: Upload completed audiobook MP3
        uses: actions/upload-artifact@v4
        with:
          name: au${{ github.run_number }}
          path: |
            work/result/au${{ github.run_number }}.mp3
            work/result/manifest.json
          if-no-files-found: error
          retention-days: 1

  cleanup:
    name: Clean temporary job input branch
    if: always()
    needs: [prepare, synthesize, merge]
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary job input branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PAYLOAD_BRANCH: ${{ inputs.payload_branch }}
        run: |
          gh api --method DELETE "repos/${GH_REPOSITORY}/git/refs/heads/${PAYLOAD_BRANCH}" || true
